[package]
name = "vice-lens"
description = "Explore the Xbox Series data of Grand Theft Auto VI: map, models, textures, movies, sound, text, and a 3D world"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rage = { path = "../rage" }
fwui = { path = "../fwui" }
wgpu = "30.0.2"
winit = "0.30.13"
pollster = "1.0.3"
bytemuck = { version = "1.25.2", features = ["derive"] }
tiny-skia = "0.12.0"
png = "0.18.1"
log = "0.4.35"
env_logger = "0.11.12"
texture2ddecoder = "0.1.2"
glam = "0.34.3"
wry = "0.57.3"
tao = "0.37.3"
rfd = "0.18.0"
regex = "1.13.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
