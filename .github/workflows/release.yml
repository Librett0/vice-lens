# Builds Vice Lens for Linux and
# Windows when a version tag is pushed, and attaches the archives to the
# release. No game data is involved.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libxdo-dev
      - run: cargo build --release -p vice-lens
      - if: runner.os == 'Linux'
        run: |
          d=vice-lens-${{ matrix.target }}
          mkdir -p $d
          cp target/release/vice-lens $d/
          cp packaging/vice-lens.desktop packaging/vice-lens.svg README.md LICENSE docs/caches.md $d/
          tar czf $d.tar.gz $d
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "vice-lens-${{ matrix.target }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/release/vice-lens.exe $d/
          Copy-Item README.md, LICENSE, docs/caches.md $d/
          Compress-Archive $d "$d.zip"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: vice-lens-*.*
